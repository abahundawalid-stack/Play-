name: Legacy Android Libretro Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_libretro:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "ndk;29.0.14206865" \
            "cmake;3.31.1"

      - name: Build Libretro Core
        run: |
          set -e

          CMAKE_PATH="$ANDROID_HOME/cmake/3.31.1"
          export PATH="$CMAKE_PATH/bin:$PATH"
          export NINJA_EXE="$CMAKE_PATH/bin/ninja"
          export ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          cd build_retro
          ./android_build.sh

      - name: Upload Libretro artifact
        uses: actions/upload-artifact@v4
        with:
          name: Play-Android-Libretro
          path: build_retro/play_libretro_*_android.so
          if-no-files-found: error
          retention-days: 7
