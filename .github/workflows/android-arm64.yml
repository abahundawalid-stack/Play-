name: Play Android ARM64 Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Play source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android components
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;29.0.14206865" \
            "cmake;3.31.1"

      - name: Install Android components
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;29.0.14206865" \
            "cmake;3.31.1"

      - name: Verify submodules
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -q '^-'; then
            echo "ERROR: Uninitialized submodule"
            exit 1
          fi

      - name: Prepare Git version
        run: |
          git config user.name "Android CI Builder"
          git config user.email "android-ci@localhost"
          git describe --tags >/dev/null 2>&1 || \
            git tag -a android-ci-build -m "Local Android CI build"
          git describe --tags --always

      - name: Check Android ABI configuration
        run: |
          echo "===== ABI CONFIGURATION ====="
          grep -n -C 3 "abiFilters\|arm64-v8a" \
            build_android/build.gradle || true
          echo "===== CONTINUE BUILD ====="
          
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_NAME: ${{ secrets.PLAY_RELEASE_STORE_FILE }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_NAME"
          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > "$RUNNER_TEMP/$KEYSTORE_NAME"
          chmod 600 "$RUNNER_TEMP/$KEYSTORE_NAME"
          test -s "$RUNNER_TEMP/$KEYSTORE_NAME"

      - name: Build signed Release APK
        working-directory: build_android
        env:
          ORG_GRADLE_PROJECT_PLAY_RELEASE_STORE_FILE: ${{ runner.temp }}/${{ secrets.PLAY_RELEASE_STORE_FILE }}
          ORG_GRADLE_PROJECT_PLAY_RELEASE_STORE_PASSWORD: ${{ secrets.PLAY_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PLAY_RELEASE_KEY_ALIAS: ${{ secrets.PLAY_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PLAY_RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature and checksum
        run: |
          APK="$(find build_android -type f \
            -path '*/outputs/apk/release/*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify \
            --verbose --print-certs "$APK"
          sha256sum "$APK" | tee APK_SHA256SUMS.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Play-Android-ARM64-Release
          path: |
            build_android/**/outputs/apk/release/*.apk
            APK_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
