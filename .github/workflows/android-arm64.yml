name: Play Android ARM64 Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-arm64.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Play with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install official Android toolchain
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;29.0.14206865" \
            "cmake;3.31.1"

      - name: Verify source and submodules
        run: |
          git submodule status --recursive
          git describe --tags --always || true
          test -f build_android/build.gradle
          test -f Source/ui_android/CMakeLists.txt

      - name: Prepare Git version
        run: |
          cd build_android
          git describe --tags >/dev/null 2>&1 || \
            git -C .. tag -a android-ci-build \
            -m "Local Android CI build"

      - name: Restrict build to ARM64
        run: |
          sed -i \
            "s/'armeabi-v7a', 'x86', 'x86_64', 'arm64-v8a'/'arm64-v8a'/" \
            build_android/build.gradle

          grep -n -A2 'abiFilters' \
            build_android/build.gradle

      - name: Build Play APK
        run: |
          cd build_android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          find build_android -type f -name "*.apk" \
            -path "*/outputs/apk/*" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Play-Android-ARM64
          path: build_android/**/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
